[project]
name = "simesh"
version = "0.1.0"
description = "Python/Cython toolkit for reading, writing, and manipulating AMRVAC-style AMR mesh data"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0"
authors = [
    { name = "Astery", email = "aster0502@outlook.com" },
]
dependencies = [
    "numpy>=1.23.5,<3.0",
]

[project.optional-dependencies]
test = [
    "jupyterlab>=4.3.4,<5.0.0",
    "ipykernel>=6.29.5,<7.0.0",
]

[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "numpy>=1.23.5,<3.0",
    "Cython>=3.0,<4.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
