[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=1.23.5,<3", "Cython>=3,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "simesh"
version = "0.2.0rc1"
description = "Independent native AMR fields and scientific analysis"
authors = [{name = "Astery", email = "aster0502@outlook.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "Cython>=3,<4", "setuptools>=77", "wheel"]
fft = ["scipy>=1.10"]
plot = ["matplotlib>=3.7"]
docs = ["mkdocs>=1.6,<2", "mkdocstrings-python>=2.0,<3", "griffelib>=2.3,<3", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pyx", "*.pxd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
